<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{if(localStorage.getItem('rvl-motion')==='calm')document.documentElement.classList.add('rvl-calm')}catch(e){}</script>
  <style>html{background:#060606;color-scheme:dark}body{visibility:hidden}</style>
  <title>PROJECT — REVACHOL</title>
  <meta name="description" content="A film by REVACHOL." />
</head>
<body class="page-project">
  <main id="app" class="project-main">

    <section class="p-hero" id="p-hero">
      <video id="p-hero-video" muted loop playsinline autoplay></video>
      <canvas id="p-hero-veil" aria-hidden="true"></canvas>
      <svg class="p-ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" />
        <circle cx="50" cy="50" r="39" />
      </svg>
      <div class="p-scanframe" aria-hidden="true"></div>
      <p class="p-status micro"><span id="p-status-line"></span><span class="p-caret" aria-hidden="true">▮</span></p>
      <div class="p-index micro" id="p-index"></div>
      <div class="p-callouts micro" id="p-callouts"></div>
      <h1 class="p-title-stack">
        <span class="p-title-ghost" id="p-title-ghost" aria-hidden="true"></span>
        <span class="p-title" id="p-title"></span>
      </h1>
    </section>

    <section class="p-sec p-spec-sec">
      <div class="p-rail"><span class="p-rail-tag" aria-hidden="true">I:</span></div>
      <div class="p-sec-body">
        <h2 class="visually-hidden">Intake</h2>
        <dl class="p-spec" id="p-spec" data-stamp></dl>
      </div>
      <div class="p-checks-v" aria-hidden="true"></div>
    </section>

    <section class="p-sec p-syn-sec">
      <div class="p-rail"><span class="p-rail-tag" aria-hidden="true">SYN:</span></div>
      <div class="p-sec-body">
        <h2 class="visually-hidden">Synopsis</h2>
        <div class="p-arc-clip" aria-hidden="true"><div class="p-arc"></div></div>
        <p class="p-synopsis" id="p-synopsis" data-stamp></p>
        <div class="p-watch">
          <button class="p-run" id="p-watch-btn" hidden data-stamp>RUN FULL FILM ▸</button>
          <div class="p-player" id="p-player" hidden></div>
        </div>
      </div>
    </section>

    <div class="p-ticker" aria-hidden="true"><div class="p-ticker-track" id="p-ticker-track"></div></div>

    <section class="p-sec p-rec-sec" id="p-rec-sec">
      <div class="p-rail"><span class="p-rail-tag" aria-hidden="true">REC:</span></div>
      <div class="p-sec-body">
        <h2 class="visually-hidden">Record — stills</h2>
        <div class="p-wall" id="p-stills"></div>
      </div>
    </section>

    <nav class="p-confirm" id="p-confirm" aria-label="More projects"></nav>

    <footer class="p-eof micro" id="p-eof"></footer>
  </main>

  <dialog class="lightbox" id="lightbox">
    <img id="lightbox-img" alt="" />
    <button id="lightbox-close" class="btn">CLOSE ✕</button>
  </dialog>
  <script type="module" src="/src/pages/project.ts"></script>
</body>
</html>
