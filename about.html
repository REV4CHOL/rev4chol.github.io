<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{if(localStorage.getItem('rvl-motion')==='calm')document.documentElement.classList.add('rvl-calm')}catch(e){}</script>
  <style>html{background:#060606;color-scheme:dark}body{visibility:hidden}</style>
  <script>/* stale-deploy self-heal: cached HTML can 404 its renamed chunks after a deploy - if the app never boots, fetch fresh HTML once and stop */addEventListener("load",function(){setTimeout(function(){if(window.rvlBooted)return;try{if(sessionStorage.getItem("rvl-heal"))return;sessionStorage.setItem("rvl-heal","1")}catch(e){return}location.reload()},1400)});</script>
  <script>/* music boot (owner: continuous across pages, on before the loading screen): the last page's place, seeked and playing before any chunk loads; the music module adopts this element. Refused (a phone's cold load: iOS grants no sound before a gesture on the document) it plays inside the page's first activating gesture — pointerup, touchend, click, keydown */(function(){try{if(localStorage.getItem('rvl-music-v1')==='off')return;var s=sessionStorage.getItem('rvl-music-pos'),p=s?JSON.parse(s):null,a=document.createElement('audio');a.preload='auto';a.loop=true;a.volume=0;a.src='/content/music/night-road.mp3';a.addEventListener('loadedmetadata',function(){if(p&&a.duration>0){var t=p.held?p.t:p.t+Math.max(0,(Date.now()-p.at)/1000);a.currentTime=((t%a.duration)+a.duration)%a.duration}});a.addEventListener('playing',function(){if(!window.rvlMusicAt)window.rvlMusicAt=performance.now();if(a.volume<0.55){var k=0,f=function(){k++;a.volume=Math.min(0.55,0.055*k);if(k<10)setTimeout(f,12)};f()}});var r=a.play();if(r&&r.catch)r.catch(function(){var g=function(){var q=a.play();if(q&&q.catch)q.catch(function(){})};['pointerup','touchend','click','keydown'].forEach(function(t){document.addEventListener(t,g,{once:true,passive:true})})});window.rvlMusicBoot=a}catch(e){}})();</script>
  <title>ABOUT — REVACHOL</title>
  <meta name="description" content="About REVACHOL — colorist, editor, AI generalist." />
</head>
<body class="page-about">
  <main id="app" class="about-main">

    <section class="a-hero">
      <p class="a-status micro"><span id="a-status-line"></span><span class="a-caret" aria-hidden="true">▮</span></p>

      <div class="a-hero-grid">
        <div class="a-id">
          <h1 class="a-name-stack">
            <span class="a-name" id="a-name"></span>
          </h1>
          <p class="a-name-plate micro" aria-hidden="true">OP-FILE ▸ ACTIVE ▪ SGN//C8FF00 ▪ 2025—∞</p>
          <p class="a-statement" id="a-statement"></p>
        </div>

        <div class="a-subject">
          <div class="a-reticle" aria-hidden="true"><i></i><i></i><i></i></div>
          <figure class="a-portrait" id="a-portrait">
            <i class="a-echo a-echo-a" aria-hidden="true"></i>
            <i class="a-echo a-echo-b" aria-hidden="true"></i>
            <canvas id="a-specimen" width="720" height="900"></canvas>
            <i class="a-sweep" aria-hidden="true"></i>
            <figcaption class="micro" id="a-portrait-cap"></figcaption>
          </figure>
          <span class="a-subj-tag micro" aria-hidden="true">SUBJ ▸ REVACHOL ▪ RAW FEED</span>
          <div class="a-callouts micro" id="a-callouts"></div>
        </div>
      </div>
    </section>

    <div class="a-cal" aria-hidden="true">
      <div class="a-cal-bars">
        <i style="--c:#C8FF00"></i><i style="--c:#FF2E63"></i><i style="--c:#2418FF"></i><i style="--c:#B79CFF"></i><i style="--c:#EDEDE6"></i><i style="--c:#0A0A12"></i><i style="--c:#060606"></i>
      </div>
      <p class="a-cal-label micro">CAL ▸ C8FF00 · FF2E63 · 2418FF · B79CFF · EDEDE6 · 0A0A12 · 060606</p>
    </div>

    <section class="a-sec a-op-sec">
      <div class="a-rail"><span class="a-rail-tag" aria-hidden="true">OP:</span></div>
      <div class="a-sec-body">
        <h2 class="visually-hidden">Operator dossier</h2>
        <div class="a-bio" id="a-bio" data-stamp></div>
        <dl class="a-spec" id="a-facts" data-stamp></dl>
      </div>
    </section>

    <section class="a-sec a-cap-sec">
      <div class="a-rail"><span class="a-rail-tag" aria-hidden="true">CAP:</span></div>
      <div class="a-sec-body">
        <h2 class="visually-hidden">Capabilities</h2>
        <div class="a-caps" id="a-caps"></div>
      </div>
    </section>

    <nav class="a-transmit" id="a-transmit" aria-label="Contact"></nav>

    <footer class="a-eof micro" id="a-eof"></footer>
  </main>

  <script type="module" src="/src/pages/about.ts"></script>
</body>
</html>
