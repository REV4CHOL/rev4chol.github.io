<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{if(localStorage.getItem('rvl-motion')==='calm')document.documentElement.classList.add('rvl-calm')}catch(e){}</script>
  <style>html{background:#060606;color-scheme:dark}body{visibility:hidden}</style>
  <script>/* stale-deploy self-heal: cached HTML can 404 its renamed chunks after a deploy - if the app never boots, fetch fresh HTML once and stop */addEventListener("load",function(){setTimeout(function(){if(window.rvlBooted)return;try{if(sessionStorage.getItem("rvl-heal"))return;sessionStorage.setItem("rvl-heal","1")}catch(e){return}location.reload()},1400)});</script>
  <title>CONTACT — REVACHOL</title>
  <meta name="description" content="Open a channel to REVACHOL — colorist, editor, AI generalist." />
</head>
<body class="page-contact">
  <main id="app" class="contact-main">
    <section class="c-console">
      <p class="c-status micro"><span id="c-status-line"></span><span class="c-caret" aria-hidden="true">▮</span></p>
      <div class="c-body">
        <h1 class="visually-hidden">Contact</h1>

        <a class="c-freq" id="c-freq" href="#" data-stamp></a>

        <div class="c-actions" data-stamp>
          <button class="c-copy" id="c-copy">COPY FREQ</button>
          <p class="c-vow">No decks. No pleasantries. Send the thing they told you to tone down.</p>
        </div>

        <div class="c-meter" id="c-meter" aria-hidden="true"></div>

        <div class="c-callouts micro" id="c-callouts"></div>

        <div class="c-aux" data-stamp>
          <span class="c-aux-label micro">AUX CHANNELS ::</span>
          <span id="c-socials"></span>
        </div>
      </div>
    </section>

    <footer class="c-eof micro"><span>EOF ▪ P·TX/01 ▪ REVACHOL</span></footer>
  </main>
  <script type="module" src="/src/pages/contact.ts"></script>
</body>
</html>
